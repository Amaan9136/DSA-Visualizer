<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algorithmica — Interactive DSA Visualizer</title>
<link rel="stylesheet" href="tailwind.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="text-[14px]">

<div class="h-screen w-screen flex flex-col">

  <!-- HEADER -->
  <header class="app-header glass flex items-center gap-4 px-4 h-14 shrink-0 z-20">
    <button id="btnMenu" class="btn rounded-lg w-9 h-9 flex items-center justify-center shrink-0 hide-lg" data-tip="Algorithms">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="flex items-center gap-2 shrink-0">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center font-display font-bold text-[15px]"
           style="background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0b0d12;">A</div>
      <span class="font-display font-bold text-[15px] tracking-tight">Algorithmica</span>
      <span class="badge hidden sm:inline">MILESTONE: SORTING</span>
    </div>

    <div class="flex-1 max-w-md relative hidden md:block">
      <input id="searchInput" placeholder="Search algorithms…" autocomplete="off"
        class="w-full glass2 rounded-lg pl-9 pr-3 py-1.5 text-[13px] outline-none focus:border-[var(--accent2)]" style="border:1px solid var(--border)"/>
      <i class="fa-solid fa-magnifying-glass absolute left-2.5" style="color:var(--text-dim); top:50%; transform:translateY(-50%); font-size:13px"></i>
    </div>

    <div class="flex-1"></div>

    <a href="https://github.com/Amaan9136" target="_blank" rel="noopener" class="credit shrink-0 text-[12px]"><span class="credit-long">Built by </span><span class="credit-short">by </span>Amaan MK</a>
    <button id="btnPanel" class="btn rounded-lg w-9 h-9 flex items-center justify-center shrink-0 hide-xl" data-tip="Details">
      <i class="fa-solid fa-file-lines"></i>
    </button>
    <button id="themeToggle" class="btn rounded-lg w-9 h-9 flex items-center justify-center shrink-0" data-tip="Toggle theme">
      <i id="iconMoon" class="fa-solid fa-moon"></i>
    </button>
    <a href="https://github.com/Amaan9136/DSA-Visualizer" target="_blank" class="btn rounded-lg w-9 h-9 hidden sm:flex items-center justify-center shrink-0" data-tip="GitHub">
      <i class="fa-brands fa-github"></i>
    </a>
  </header>

  <div class="flex flex-1 min-h-0">

    <!-- SIDEBAR -->
    <div id="navDrawer" class="nav-drawer">
      <div class="drawer-search">
        <input id="searchInputMobile" placeholder="Search algorithms…" autocomplete="off" class="w-full glass2 rounded-lg px-3 py-1.5 text-[13px] outline-none focus:border-[var(--accent2)]" style="border:1px solid var(--border)"/>
      </div>
      <aside class="glass w-60 shrink-0 overflow-y-auto py-3 hidden lg:block" id="sidebar"></aside>
    </div>

    <!-- MAIN -->
    <main class="flex-1 min-w-0 flex flex-col">

      <!-- Visualization area -->
      <section class="main-section flex-1 min-h-0 flex flex-col p-4 gap-3">

        <div class="flex items-center justify-between flex-wrap gap-2">
          <div>
            <h1 id="algoTitle" class="font-display font-bold text-xl leading-tight">Bubble Sort</h1>
            <p id="algoSub" class="text-[12px]" style="color:var(--text-dim)">Sorting · comparison-based</p>
          </div>
          <div class="flex items-center gap-2 text-[12px]" style="color:var(--text-dim)">
            <button id="btnViewIter" class="btn rounded-md px-2.5 py-1.5 text-[12px]">View Iteration</button>
            <span id="frameCounter">Step 0 / 0</span>
          </div>
        </div>

        <div class="viz-box glass rounded-xl flex-1 min-h-0 relative overflow-hidden">
          <div id="canvasWrap" class="absolute inset-0 flex items-end justify-center gap-1 px-6 pb-6 pt-10"></div>
          <div id="tooltip" class="chart-tip"></div>
          <div id="stepNote" class="absolute top-3 left-4 right-4 text-[12.5px] font-mono glass2 rounded-lg px-3 py-1.5 fade-in" style="color:var(--text-dim); display:none"></div>
        </div>

        <!-- CONTROLS -->
        <div class="glass rounded-xl p-3 flex flex-col gap-2.5">
          <div class="flex items-center gap-2 flex-wrap">
            <button id="btnReset" class="btn rounded-md px-2.5 py-1.5" data-tip="Reset"><i class="fa-solid fa-arrows-rotate"></i></button>
            <button id="btnPrev" class="btn rounded-md px-2.5 py-1.5" data-tip="Previous step"><i class="fa-solid fa-angles-left"></i></button>
            <button id="btnPlay" class="btn-primary rounded-md px-4 py-1.5 font-semibold flex items-center gap-1.5">
              <i id="playIcon" class="fa-solid fa-play"></i>
              <span id="playLabel">Play</span>
            </button>
            <button id="btnNext" class="btn rounded-md px-2.5 py-1.5" data-tip="Next step"><i class="fa-solid fa-angles-right"></i></button>

            <div class="flex items-center gap-2 ml-1">
              <span class="text-[11px]" style="color:var(--text-dim)">Speed</span>
              <input id="speedSlider" type="range" min="0.01" max="10" step="0.01" value="1" class="w-32 h-1">
              <input id="speedInput" type="number" min="0.01" max="10" step="0.01" value="1" class="w-20 glass2 rounded-md px-2 py-1 text-[12px] font-mono outline-none focus:border-[var(--accent2)]" style="border:1px solid var(--border)"/>
              <span class="text-[11px]" style="color:var(--text-dim)">s</span>
            </div>

            <div class="flex-1"></div>

            <button id="btnRandom" class="btn rounded-md px-3 py-1.5 text-[12.5px]">Random Array</button>
            <button id="btnCustomToggle" class="btn rounded-md px-3 py-1.5 text-[12.5px]">Custom Input</button>
          </div>

          <div id="customBar" class="hidden items-center gap-2">
            <input id="customInput" placeholder="e.g. 5, 3, 8, 1, 9, 2" class="flex-1 glass2 rounded-md px-3 py-1.5 text-[13px] font-mono outline-none focus:border-[var(--accent2)]" style="border:1px solid var(--border)"/>
            <button id="btnCustomApply" class="btn-primary rounded-md px-3 py-1.5 text-[12.5px] font-semibold">Apply</button>
          </div>

          <div id="targetBar" class="hidden items-center gap-2">
            <span id="targetLabelText" class="text-[12px] shrink-0" style="color:var(--text-dim)">Search for:</span>
            <input id="targetInput" type="number" placeholder="target value" class="w-32 glass2 rounded-md px-3 py-1.5 text-[13px] font-mono outline-none focus:border-[var(--accent2)]" style="border:1px solid var(--border)"/>
            <button id="btnTargetApply" class="btn-primary rounded-md px-3 py-1.5 text-[12.5px] font-semibold">Search</button>
            <span id="targetHint" class="text-[11px]" style="color:var(--text-dim)"></span>
          </div>

          <div id="textBar" class="hidden items-center gap-2">
            <span id="textLabelText" class="text-[12px] shrink-0" style="color:var(--text-dim)">Input:</span>
            <input id="textInputField" type="text" placeholder="value" class="flex-1 glass2 rounded-md px-3 py-1.5 text-[13px] font-mono outline-none focus:border-[var(--accent2)]" style="border:1px solid var(--border)"/>
            <button id="btnTextApply" class="btn-primary rounded-md px-3 py-1.5 text-[12.5px] font-semibold">Run</button>
          </div>

          <div id="graphBar" class="hidden items-center gap-2">
            <span class="text-[12px] shrink-0" style="color:var(--text-dim)" id="graphStartLabel">Start node:</span>
            <select id="startNodeSelect" class="glass2 rounded-md px-2 py-1.5 text-[13px] font-mono outline-none focus:border-[var(--accent2)]" style="border:1px solid var(--border)"></select>
            <button id="btnNewGraph" class="btn rounded-md px-3 py-1.5 text-[12.5px]">New Random Graph</button>
          </div>
        </div>
      </section>
    </main>

    <!-- RIGHT PANEL -->
    <aside id="rightPanel" class="glass w-[400px] shrink-0 hidden xl:flex flex-col min-h-0">
      <div class="flex text-[13px] shrink-0 overflow-x-auto" id="tabBar">
        <div class="tab active px-3 py-2.5 shrink-0" data-tab="explain">Explanation</div>
        <div class="tab px-3 py-2.5 shrink-0" data-tab="iteration">Iteration</div>
        <div class="tab px-3 py-2.5 shrink-0" data-tab="pseudo">Pseudocode</div>
        <div class="tab px-3 py-2.5 shrink-0" data-tab="python">Python</div>
        <div class="tab px-3 py-2.5 shrink-0" data-tab="complexity">Complexity</div>
      </div>

      <div class="flex-1 min-h-0 overflow-y-auto">
        <div id="tab-explain" class="p-4 text-[13px] leading-relaxed fade-in"></div>
        <div id="tab-iteration" class="hidden p-2 text-[13px] leading-relaxed">
          <div class="px-2 py-1 text-[11px] font-mono" id="iterationMeta" style="color:var(--text-dim)"></div>
          <div id="iterationStepsList"></div>
        </div>
        <div id="tab-pseudo" class="p-4 text-[13px] leading-relaxed font-mono hidden whitespace-pre-wrap"></div>
        <div id="tab-python" class="hidden h-full flex flex-col">
          <div class="flex items-center gap-1.5 px-3 py-2 shrink-0" style="border-bottom:1px solid var(--border)">
            <button id="btnCopyPy" class="btn rounded px-2 py-1 text-[11px]">Copy</button>
            <button id="btnDownloadPy" class="btn rounded px-2 py-1 text-[11px]">Download .py</button>
            <div class="flex-1"></div>
            <input id="pySearch" placeholder="find in code…" class="glass2 rounded px-2 py-1 text-[11px] w-28 outline-none" style="border:1px solid var(--border)">
          </div>
          <pre class="flex-1 overflow-auto m-0 !bg-transparent text-[12.5px]" style="background:transparent!important"><code id="pyCode" class="language-python"></code></pre>
        </div>
        <div id="tab-complexity" class="p-4 text-[13px] leading-relaxed hidden"></div>
      </div>
    </aside>
  </div>
</div>

<div id="drawerBackdrop" class="drawer-backdrop"></div>

<div id="iterModal" class="iter-modal">
  <div class="iter-modal-card glass rounded-xl">
    <div class="iter-modal-head">
      <div class="flex-1 min-w-0">
        <div class="font-display font-bold text-[15px]">Iteration Steps</div>
        <div id="iterModalMeta" class="text-[11px] font-mono" style="color:var(--text-dim)"></div>
      </div>
      <button id="btnIterBreakdown" class="btn rounded-md px-2.5 py-1.5 text-[12px]">Breakdown: Off</button>
      <button id="btnIterClose" class="btn rounded-md px-2.5 py-1.5 text-[12px]" data-tip="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="iterModalList" class="iter-modal-body"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
